spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: ${MYSQL_URL}
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 连接池参数：不加这些时 Druid 走默认值（max-active=8、max-wait=-1 无限等待），
      # 一旦 DB 慢查询堆积会把 web 线程全部挂死。
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filter:
        slf4j:
          enabled: true
          statement-create-after-log-enabled: false
          statement-close-after-log-enabled: false
          result-set-open-after-log-enabled: false
          result-set-close-after-log-enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 默认走 slf4j，不再把含手机号/密码哈希的 SQL 打到 stdout；
    # 本地排查时用 MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl 临时打开。
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名
      logic-delete-value: 1 # 逻辑已删除值
      logic-not-delete-value: 0 # 逻辑未删除值