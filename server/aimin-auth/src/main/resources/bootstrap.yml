server:
  port: 8081
  # 默认只监听本机回环；对外暴露需显式设 SERVER__ADDRESS
  address: ${SERVER__ADDRESS:127.0.0.1}
  servlet:
    context-path: /aimin-auth

spring:
  application:
    name: aimin-auth

  profiles:
    active: dev

  config:
    import:
      - classpath:base.yml
      - classpath:redis.yml
      - classpath:cache.yml
      - classpath:ds.yml


# 申请微信小程序测试号即可，https://developers.weixin.qq.com/miniprogram/dev/devtools/sandbox.html
wx:
  appid: ${WX_APPID}
  secret: ${WX_SECRET}

