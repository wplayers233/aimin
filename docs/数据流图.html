<rect x="28" y="884" width="1144" height="112" rx="12" fill="#fff" stroke="#e3e1d9" stroke-width="0.8"/>
<text class="t" x="48" y="908" font-size="12" font-weight="600">读图要点</text>
<text class="t" x="48" y="930" font-size="11.5" fill="#5F5E5A">1　写入侧的产物是两份 JSON 快照，不是数据库；重启靠它们重建向量库与 BM25。</text>
<text class="t" x="48" y="950" font-size="11.5" fill="#5F5E5A">2　读取侧三路召回先各自取量，再由 RRF 压成 evidence；门控失败即拒答，模型根本不参与。</text>
<text class="t" x="48" y="970" font-size="11.5" fill="#5F5E5A">3　D7 是唯一的"请求态"存储，进程重启后待确认问题全部失效；D5/D6 才是可回放的事实来源。</text>
<text class="t" x="560" y="930" font-size="11.5" fill="#5F5E5A">4　D4 绕过 D2/D3 的更新节奏：药品表改了要 refresh() 才生效。</text>
<text class="t" x="560" y="950" font-size="11.5" fill="#5F5E5A">5　SessionMemory（40 条内存）只写不读入 prompt，见 D7 同属"会丢且不影响回答"。</text>
<text class="t" x="560" y="970" font-size="11.5" fill="#5F5E5A">6　所有写库都在 P12，流式生成期间没有中间落库，断流即丢这次回答。</text>
